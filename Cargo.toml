[package]
name = "paper-shell"
version = "0.1.12"
edition = "2024"
license = "MIT"
description = "A simple, compact and informative text editor for everyday writing."

[package.metadata.bundle]
name = "Paper Shell"
identifier = "paper.shell.app"
category = "Productivity"
copyright = "© 2025 RetricSu"
short_description = "A writing editor"
long_description = """
A simple, compact and informative text editor for everyday writing.
"""
icon = ["assets/app-icon.icns"]

[package.metadata.bundle.osx]
info_plist_exts = ["InfoAdditions.plist"]

[lib]
name = "paper_shell"
path = "src/lib.rs"

[dependencies]
egui = "0.33.2"
eframe = "0.33.2"
egui-phosphor = "0.11.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1.41"
tracing-subscriber = "0.3.20"
font-kit = "0.14.3"
rfd = "0.15"
chrono = { version = "0.4", features = ["serde"] }
confy = "0.6"
directories = "5.0"
xxhash-rust = { version = "0.8", features = ["xxh64"] }
uuid = { version = "1.0", features = ["v4"] }
thiserror = "2.0"
similar = "2.5"
arboard = "3"
jieba-rs = "0.7"
once_cell = "1.21.3"
toml = "0.8"
ureq = "3.5.0"
aes-gcm = { version = "0.11.1", features = ["zeroize"] }
zeroize = "1.8"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "async-secret-service", "async-io", "crypto-rust"] }
sha2 = "0.11.1"
pbkdf2 = "0.13.0"
base64 = "0.23.1"
getrandom = { version = "0.4.3", features = ["sys_rng"] }
url = "2.5.8"
percent-encoding = "2.3.2"
semver = "1.0"
tempfile = "3"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tar = "0.4"
flate2 = "1.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
self-replace = "1.5.1"

[target.'cfg(unix)'.dependencies]
xattr = "1.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.3"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"
block2 = "0.6.2"

# AppKit layout/printing must be exercised on the process main thread.
[[test]]
name = "print_layout"
path = "tests/print_layout.rs"
harness = false
