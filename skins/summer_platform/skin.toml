id = "summer_platform"
name = "夏日站台"
description = "《听到涛声》(1993) 官方剧照，胶片颗粒与灰蓝站台。背景以 18% 柔光呈现，字号、行距与内边距贴合侧耳倾听主题，保留清晰的写作文字。"
author = "Paper Shell · 图片 © 1993 Saeko Himuro/Keiko Niwa/Studio Ghibli, N"
version = "1.0.0"

[typography]
font_family = "Default"
font_size = 14.0
line_spacing = 1.5
font_color = "#263441"
format_use_tabs = false

[spacing]
window_margin = 12.0
editor_padding_left = 2.0
editor_padding_right = 6.0
editor_padding_top = 6.0
editor_padding_bottom = 6.0
item_spacing_x = 8.0
item_spacing_y = 8.0

[colors]
dark_mode = false
background_color = "#F2F0E9"
editor_background_color = "#F2F0E9"
sidebar_background_color = "#E8E7E0"
titlebar_background_color = "#E8E7E0"
text_color = "#263441"
selection_color = "#C3D3DB"
accent_color = "#557B8C"

[effects]
background_image = "background.jpg"
background_image_opacity = 0.18
background_image_fit = "cover"
window_opacity = 1.0
editor_opacity = 1.0
corner_radius = 2.0
shadow = false
