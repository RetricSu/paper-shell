name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag or version for release (e.g. v0.1.0, defaults to git tag or Cargo.toml version)'
        required: false
        default: ''
      create_release:
        description: 'Publish release to GitHub Releases'
        type: boolean
        default: true
      draft:
        description: 'Create draft release'
        type: boolean
        default: false
      prerelease:
        description: 'Create prerelease'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-macos:
    name: Build & Package macOS Release
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Cache cargo registry and build target
        uses: Swatinem/rust-cache@v2

      - name: Cache cargo-bundle binary
        id: cache-cargo-bundle
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-bundle
          key: ${{ runner.os }}-cargo-bundle-v0.9.0

      - name: Install cargo-bundle
        if: steps.cache-cargo-bundle.outputs.cache-hit != 'true'
        run: cargo install cargo-bundle --version 0.9.0

      - name: Build and bundle macOS aarch64 (Apple Silicon)
        run: cargo bundle --release --target aarch64-apple-darwin

      - name: Build and bundle macOS x86_64 (Intel)
        run: cargo bundle --release --target x86_64-apple-darwin

      - name: Package release artifacts (DMG & ZIP)
        run: |
          mkdir -p dist

          create_dmg() {
            local app_path="$1"
            local dmg_path="$2"
            local volname="Paper Shell"
            local tmp_stage
            tmp_stage=$(mktemp -d)
            cp -R "$app_path" "$tmp_stage/"
            ln -s /Applications "$tmp_stage/Applications"
            hdiutil create -volname "$volname" -srcfolder "$tmp_stage" -ov -format UDZO "$dmg_path"
            rm -rf "$tmp_stage"
          }

          create_zip() {
            local app_path="$1"
            local zip_path="$2"
            ditto -c -k --sequesterRsrc --keepParent "$app_path" "$zip_path"
          }

          echo "==> Packaging Apple Silicon (aarch64)..."
          codesign --force --deep --sign - "target/aarch64-apple-darwin/release/bundle/osx/Paper Shell.app"
          create_dmg "target/aarch64-apple-darwin/release/bundle/osx/Paper Shell.app" "dist/Paper-Shell-macOS-aarch64.dmg"
          create_zip "target/aarch64-apple-darwin/release/bundle/osx/Paper Shell.app" "dist/Paper-Shell-macOS-aarch64.zip"

          echo "==> Packaging Intel (x86_64)..."
          codesign --force --deep --sign - "target/x86_64-apple-darwin/release/bundle/osx/Paper Shell.app"
          create_dmg "target/x86_64-apple-darwin/release/bundle/osx/Paper Shell.app" "dist/Paper-Shell-macOS-x86_64.dmg"
          create_zip "target/x86_64-apple-darwin/release/bundle/osx/Paper Shell.app" "dist/Paper-Shell-macOS-x86_64.zip"

          echo "==> Creating and packaging Universal App..."
          mkdir -p /tmp/universal
          cp -R "target/aarch64-apple-darwin/release/bundle/osx/Paper Shell.app" "/tmp/universal/Paper Shell.app"
          lipo -create \
            "target/aarch64-apple-darwin/release/bundle/osx/Paper Shell.app/Contents/MacOS/paper-shell" \
            "target/x86_64-apple-darwin/release/bundle/osx/Paper Shell.app/Contents/MacOS/paper-shell" \
            -output "/tmp/universal/Paper Shell.app/Contents/MacOS/paper-shell"
          codesign --force --deep --sign - "/tmp/universal/Paper Shell.app"

          create_dmg "/tmp/universal/Paper Shell.app" "dist/Paper-Shell-macOS-universal.dmg"
          create_zip "/tmp/universal/Paper Shell.app" "dist/Paper-Shell-macOS-universal.zip"
          rm -rf /tmp/universal

      - name: Upload artifacts to GitHub Actions run
        uses: actions/upload-artifact@v4
        with:
          name: paper-shell-macos-release
          path: dist/*

  release-linux:
    name: Build & Package Linux Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libx11-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libfontconfig1-dev libfreetype6-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache cargo registry and build target
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked --target x86_64-unknown-linux-gnu

      - name: Package release artifact (tar.gz)
        run: |
          mkdir -p dist
          tar -czf dist/Paper-Shell-Linux-x86_64.tar.gz -C target/x86_64-unknown-linux-gnu/release paper-shell

      - name: Upload artifacts to GitHub Actions run
        uses: actions/upload-artifact@v4
        with:
          name: paper-shell-linux-release
          path: dist/*

  release-windows:
    name: Build & Package Windows Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry and build target
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Package release artifact (ZIP)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Compress-Archive -Path target/x86_64-pc-windows-msvc/release/paper-shell.exe -DestinationPath dist/Paper-Shell-Windows-x86_64.zip

      - name: Upload artifacts to GitHub Actions run
        uses: actions/upload-artifact@v4
        with:
          name: paper-shell-windows-release
          path: dist/*

  publish-release:
    name: Publish GitHub Release
    needs: [release-macos, release-linux, release-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.create_release == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256 checksums
        run: |
          cd dist
          rm -f SHA256SUMS.txt
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload checksums artifact
        uses: actions/upload-artifact@v4
        with:
          name: paper-shell-checksums
          path: dist/SHA256SUMS.txt

      - name: Determine tag name
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "name=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "name=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            VERSION=$(grep '^version = ' Cargo.toml | head -1 | cut -d '"' -f 2)
            echo "name=v${VERSION}" >> $GITHUB_OUTPUT
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Paper Shell ${{ steps.tag.outputs.name }}
          draft: ${{ github.event.inputs.draft == 'true' }}
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            dist/*
