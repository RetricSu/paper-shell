name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (vX.Y.Z, must match Cargo.toml; defaults to current tag or package version)'
        required: false
        default: ''
      create_release:
        description: 'Publish release to GitHub Releases'
        type: boolean
        default: true
      draft:
        description: 'Create draft release'
        type: boolean
        default: false
      prerelease:
        description: 'Create prerelease'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-version:
    name: Validate release version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Match tag, manifest, and lockfile versions
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag_name }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path('Cargo.toml').read_text())['package']['version']
          packages = tomllib.loads(Path('Cargo.lock').read_text())['package']
          locked = next(p['version'] for p in packages if p['name'] == 'paper-shell')
          tag = os.environ['INPUT_TAG'] or (os.environ['GITHUB_REF_NAME'] if os.environ['GITHUB_REF_TYPE'] == 'tag' else f'v{version}')
          if locked != version or tag != f'v{version}':
              raise SystemExit(f'Release tag ({tag}), Cargo.toml ({version}), and Cargo.lock ({locked}) must match')
          existing = subprocess.run(['git', 'rev-parse', '--verify', f'refs/tags/{tag}^{{commit}}'], capture_output=True, text=True)
          if existing.returncode == 0 and existing.stdout.strip() != os.environ['GITHUB_SHA']:
              raise SystemExit(f'{tag} points to a different commit; run this workflow on that tag or bump the version')
          prerelease = '-' in version or os.environ['INPUT_PRERELEASE'] == 'true'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'tag={tag}\nprerelease={str(prerelease).lower()}\n')
          PY

  release-macos:
    name: Build & Package macOS Release
    runs-on: macos-latest
    needs: release-version

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Cache cargo registry and build target
        uses: Swatinem/rust-cache@v2

      - name: Cache cargo-bundle binary
        id: cache-cargo-bundle
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-bundle
          key: ${{ runner.os }}-cargo-bundle-v0.9.0

      - name: Install cargo-bundle
        if: steps.cache-cargo-bundle.outputs.cache-hit != 'true'
        run: cargo install cargo-bundle --version 0.9.0

      - name: Build and bundle macOS aarch64 (Apple Silicon)
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          CARGO_BUNDLE_SKIP_BUILD=1 cargo bundle --release --target aarch64-apple-darwin
          git diff --exit-code -- Cargo.lock

      - name: Build and bundle macOS x86_64 (Intel)
        run: |
          cargo build --release --locked --target x86_64-apple-darwin
          CARGO_BUNDLE_SKIP_BUILD=1 cargo bundle --release --target x86_64-apple-darwin
          git diff --exit-code -- Cargo.lock

      - name: Package release artifacts (DMG & ZIP)
        run: |
          mkdir -p dist

          create_dmg() {
            local app_path="$1"
            local dmg_path="$2"
            local volname="Paper Shell"
            local tmp_stage
            tmp_stage=$(mktemp -d)
            cp -R "$app_path" "$tmp_stage/"
            ln -s /Applications "$tmp_stage/Applications"
            hdiutil create -volname "$volname" -srcfolder "$tmp_stage" -ov -format UDZO "$dmg_path"
            rm -rf "$tmp_stage"
          }

          create_zip() {
            local app_path="$1"
            local zip_path="$2"
            ditto -c -k --sequesterRsrc --keepParent "$app_path" "$zip_path"
          }

          echo "==> Packaging Apple Silicon (aarch64)..."
          codesign --force --deep --sign - "target/aarch64-apple-darwin/release/bundle/osx/Paper Shell.app"
          create_dmg "target/aarch64-apple-darwin/release/bundle/osx/Paper Shell.app" "dist/Paper-Shell-macOS-aarch64.dmg"
          create_zip "target/aarch64-apple-darwin/release/bundle/osx/Paper Shell.app" "dist/Paper-Shell-macOS-aarch64.zip"

          echo "==> Packaging Intel (x86_64)..."
          codesign --force --deep --sign - "target/x86_64-apple-darwin/release/bundle/osx/Paper Shell.app"
          create_dmg "target/x86_64-apple-darwin/release/bundle/osx/Paper Shell.app" "dist/Paper-Shell-macOS-x86_64.dmg"
          create_zip "target/x86_64-apple-darwin/release/bundle/osx/Paper Shell.app" "dist/Paper-Shell-macOS-x86_64.zip"

          echo "==> Creating and packaging Universal App..."
          mkdir -p /tmp/universal
          cp -R "target/aarch64-apple-darwin/release/bundle/osx/Paper Shell.app" "/tmp/universal/Paper Shell.app"
          lipo -create \
            "target/aarch64-apple-darwin/release/bundle/osx/Paper Shell.app/Contents/MacOS/paper-shell" \
            "target/x86_64-apple-darwin/release/bundle/osx/Paper Shell.app/Contents/MacOS/paper-shell" \
            -output "/tmp/universal/Paper Shell.app/Contents/MacOS/paper-shell"
          codesign --force --deep --sign - "/tmp/universal/Paper Shell.app"
          codesign --verify --deep --strict "/tmp/universal/Paper Shell.app"

          create_dmg "/tmp/universal/Paper Shell.app" "dist/Paper-Shell-macOS-universal.dmg"
          create_zip "/tmp/universal/Paper Shell.app" "dist/Paper-Shell-macOS-universal.zip"
          rm -rf /tmp/universal

      - name: Upload artifacts to GitHub Actions run
        uses: actions/upload-artifact@v4
        with:
          name: paper-shell-macos-release
          path: dist/*

  release-linux:
    name: Build & Package Linux Release
    runs-on: ubuntu-latest
    needs: release-version

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libx11-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libfontconfig1-dev libfreetype6-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache cargo registry and build target
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked --target x86_64-unknown-linux-gnu

      - name: Package release artifact (tar.gz)
        run: |
          mkdir -p dist
          tar -czf dist/Paper-Shell-Linux-x86_64.tar.gz -C target/x86_64-unknown-linux-gnu/release paper-shell

      - name: Upload artifacts to GitHub Actions run
        uses: actions/upload-artifact@v4
        with:
          name: paper-shell-linux-release
          path: dist/*

  release-windows:
    name: Build & Package Windows Release
    runs-on: windows-latest
    needs: release-version

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry and build target
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Package release artifact (ZIP)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Compress-Archive -Path target/x86_64-pc-windows-msvc/release/paper-shell.exe -DestinationPath dist/Paper-Shell-Windows-x86_64.zip

      - name: Upload artifacts to GitHub Actions run
        uses: actions/upload-artifact@v4
        with:
          name: paper-shell-windows-release
          path: dist/*

  publish-release:
    name: Publish GitHub Release
    needs: [release-version, release-macos, release-linux, release-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.create_release == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Validate updater assets and generate SHA256 checksums
        run: |
          python3 scripts/check-update-assets.py dist
          cd dist
          rm -f SHA256SUMS.txt
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload checksums artifact
        uses: actions/upload-artifact@v4
        with:
          name: paper-shell-checksums
          path: dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Paper Shell ${{ needs.release-version.outputs.tag }}
          draft: ${{ github.event.inputs.draft == 'true' }}
          prerelease: ${{ needs.release-version.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            dist/*
