id = "deep_sea"
name = "深海幽蓝"
description = "幽深静谧的海底靛蓝，带来深邃沉浸的专注氛围"
author = "Paper Shell"
version = "1.0.0"

[typography]
font_family = "Default"
font_size = 14.0
line_spacing = 1.55
font_color = "#E0E8F5"
format_use_tabs = false

[spacing]
window_margin = 0.0
editor_padding = 24.0
item_spacing = 8.0

[colors]
dark_mode = true
background_color = "#0B1528"
editor_background_color = "#101F38"
sidebar_background_color = "#081020"
titlebar_background_color = "#0B1528"
text_color = "#E0E8F5"
selection_color = "#1E3A68"
accent_color = "#388BFD"

[effects]
background_image_opacity = 0.22
background_image_fit = "cover"
window_opacity = 1.0
editor_opacity = 0.95
corner_radius = 2.0
shadow = true
